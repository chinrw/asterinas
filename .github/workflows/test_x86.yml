name: "Test x86-64  "

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  basic-test:
    runs-on: ubuntu-latest
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
      volumes:
        # Map the following directories on the host into the container so that
        # the container can remove them to save some precious disk space (~16GB),
        # which is quite limited on free-tier Github runners.
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    strategy:
      fail-fast: false
      matrix:
        id: ['lint', 'compile', 'usermode_test', 'ktest']
    steps:
      - name: Free disk space
        # Remove unused packages from the host to save disk space.
        run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
      - uses: actions/checkout@v4
      - name: Run basic tests
        uses: ./.github/actions/test
        with:
          auto_test: 'general'
          runs_on: 'ubuntu-latest'

  aster-core-ktest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        smp: [1, 4]
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
      volumes:
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    env:
      RUSTUP_HOME: /root/.rustup
      CONSOLE: ttyS0
      OVMF: "on"
      QEMU_DISPLAY: none
      SMP: ${{ matrix.smp }}
      MEM: 4G
      NETDEV: user
      VHOST: "off"
      BOOT_PROTOCOL: linux-efi-handover64
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Free disk space
        run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
      - uses: actions/checkout@v4
      - name: Run aster-core ktests
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p target/aster-core-ktest
          make install_osdk initramfs
          cd kernel/core
          # release-lto retains the aster-core ktests missing from the default CI build.
          timeout 20m cargo osdk test --profile release-lto \
            --initramfs="$GITHUB_WORKSPACE/test/initramfs/build/initramfs.cpio.gz" \
            --grub-mkrescue="$(command -v grub-mkrescue)" \
            --grub-boot-protocol=linux \
            --kcmd-args=earlycon --kcmd-args=console=ttyS0 \
            --qemu-args="-accel kvm" 2>&1 | tee "$GITHUB_WORKSPACE/target/aster-core-ktest/core.log"
      - name: Verify timer regression coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          output = Path('target/aster-core-ktest')
          text = re.sub(r'\x1b\[[0-9;]*m', '', (output / 'core.log').read_text())
          names = [
              'timer_lifecycle_regressions',
              'selected_old_generation_cannot_replace_a_same_deadline_rearm',
              'concurrent_rearm_cancel_and_dispatch_preserve_generations',
          ]
          for name in names:
              assert f'test aster_core::time::core::timer::tests::{name} ...' in text, name
          summaries = re.findall(r'test result: ok\. (\d+) passed; 0 failed; 0 filtered out\.', text)
          assert len(summaries) == 1 and int(summaries[0]) >= len(names), summaries
          cpus = int(os.environ['SMP'])
          processors = sorted({int(cpu) for cpu in re.findall(r'Processor (\d+) started', text)})
          assert processors == list(range(1, cpus)), processors
          result = dict(commit=os.environ['GITHUB_SHA'], cpus=cpus,
                        passed=int(summaries[0]), timer_tests=names, processors=processors)
          (output / 'results.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PY
      - name: Preserve aster-core ktest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aster-core-ktest-smp${{ matrix.smp }}
          path: target/aster-core-ktest/

  osdk-test:
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: -v /dev:/dev --privileged
      volumes:
        # Map the following directories on the host into the container so that
        # the container can remove them to save some precious disk space (~16GB),
        # which is quite limited on free-tier Github runners.
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    strategy:
      fail-fast: false
      matrix:
        image: ['asterinas/kernel-dev:0.19.0-20261012', 'asterinas/osdk-dev:0.19.0-20261012']
    steps:
      - name: Free disk space
        # Remove unused packages from the host to save disk space.
        run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
      - uses: actions/checkout@v4

      - name: Run OSDK tests
        uses: ./.github/actions/test
        with:
          auto_test: 'osdk'
          intel_tdx: false

  boot-test:
    runs-on: ubuntu-latest
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: 'legacy32', boot_protocol: 'linux-legacy32', smp: 4 }
          - { variant: 'multiboot2-smp4', boot_protocol: 'multiboot', smp: 4 }
          - { variant: 'multiboot2-smp4-rootfs', boot_protocol: 'multiboot', smp: 4, rootfs_boot: true }
          - { variant: 'pvh-smp4-rootfs', boot_protocol: 'pvh', smp: 4, rootfs_boot: true}
    steps:
      - uses: actions/checkout@v4
      - name: Run boot test (${{ matrix.variant }})
        uses: ./.github/actions/test
        with:
          auto_test: 'boot'
          smp: ${{ matrix.smp }}
          boot_protocol: ${{ matrix.boot_protocol }}
          rootfs_boot: ${{ matrix.rootfs_boot }}

  regression-test:
    runs-on: ubuntu-latest
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
      volumes:
        # Map the following directories on the host into the container so that
        # the container can remove them to save some precious disk space (~16GB),
        # which is quite limited on free-tier Github runners.
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: 'handover64-debug', release: false, boot_protocol: 'linux-efi-handover64' }
          - { variant: 'multiboot2-smp4',  boot_protocol: 'multiboot2', smp: 4 }
    steps:
      - name: Free disk space
        # Remove unused packages from the host to save disk space.
        run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
      - uses: actions/checkout@v4
      - name: Run regression test (${{ matrix.variant }})
        uses: ./.github/actions/test
        with:
          auto_test: 'regression'
          release: ${{ !contains(matrix.release, 'false') }}
          smp: ${{ matrix.smp }}
          boot_protocol: ${{ matrix.boot_protocol || 'linux-efi-handover64' }}

  conformance-test:
    runs-on: ubuntu-latest
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
      volumes:
        # Map the following directories on the host into the container so that
        # the container can remove them to save some precious disk space (~16GB),
        # which is quite limited on free-tier Github runners.
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    strategy:
      fail-fast: false
      matrix:
        suite: ['ltp', 'gvisor', 'kselftest']
        variant:
          - 'debug'
          - 'ext2-microvm'
          - 'ext2-iommu-debug'
          - 'exfat-multiboot2-nokvm'
          - 'multiboot2-smp4'
        include:
          - { variant: 'debug', release: false, boot_protocol: 'linux-efi-pe64' }
          - { variant: 'ext2-microvm', scheme: 'microvm', conformance_test_workdir: '/ext2', conformance_test_extra_blocklists: 'blocklists.ext2' }
          - { variant: 'ext2-iommu-debug', scheme: 'iommu', conformance_test_workdir: '/ext2', conformance_test_extra_blocklists: 'blocklists.ext2', release: false }
          - { variant: 'exfat-multiboot2-nokvm', boot_protocol: 'multiboot2', enable_kvm: false, conformance_test_workdir: '/exfat', conformance_test_extra_blocklists: 'blocklists.exfat' }
          - { variant: 'multiboot2-smp4', boot_protocol: 'multiboot2', smp: 4 }
    steps:
      - name: Free disk space
        # Remove unused packages from the host to save disk space.
        run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
      - uses: actions/checkout@v4
      - name: Run conformance test (${{ matrix.variant }}, ${{ matrix.suite }})
        uses: ./.github/actions/test
        with:
          auto_test: 'conformance'
          release: ${{ !contains(matrix.release, 'false') }}
          enable_kvm: ${{ !contains(matrix.enable_kvm, 'false') }}
          smp: ${{ matrix.smp }}
          netdev: ${{ matrix.netdev || 'tap' }}
          scheme: ${{ matrix.scheme }}
          conformance_test_suite: ${{ matrix.suite }}
          conformance_test_workdir: ${{ matrix.conformance_test_workdir }}
          conformance_test_extra_blocklists: ${{ matrix.conformance_test_extra_blocklists }}
          boot_protocol: ${{ matrix.boot_protocol || 'linux-efi-handover64' }}

  cross-compile-test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm-cross-boot
            runs_on: ubuntu-24.04-arm
            image: asterinas/kernel-dev:0.19.0-20261012
            auto_test: boot
            enable_kvm: false
    runs-on: ${{ matrix.runs_on }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Run cross-compile tests (${{ matrix.name }})
        uses: ./.github/actions/test
        with:
          auto_test: ${{ matrix.auto_test }}
          enable_kvm: ${{ matrix.enable_kvm }}

  xfstests:
    name: xfstests (${{ matrix.fs_type }})
    runs-on: ubuntu-latest
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
      volumes:
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - fs_type: 'ext2'
            runlist: 'short.list'
            disk_size: '2G'
          - fs_type: 'overlay'
            runlist: 'short.list'
            disk_size: '6G'
          - fs_type: 'tmpfs'
            runlist: 'short.list'
            disk_size: ''
          - fs_type: 'virtiofs'
            runlist: 'short.list'
            disk_size: ''
    steps:
      - name: Free disk space
        run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
      - uses: actions/checkout@v4
      - name: Run xfstests (${{ matrix.fs_type }})
        uses: ./.github/actions/test
        with:
          auto_test: 'conformance'
          conformance_test_suite: 'xfstests'
          release: true
          mem: '12G'
          xfstests_fs_type: ${{ matrix.fs_type }}
          xfstests_runlist: ${{ matrix.runlist }}
          xfstests_disk_size: ${{ matrix.disk_size }}

  pjdfstest:
    name: pjdfstest (${{ matrix.fs_type }})
    runs-on: ubuntu-latest
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
      volumes:
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - fs_type: 'ext2'
          - fs_type: 'ramfs'
    steps:
      - name: Free disk space
        run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
      - uses: actions/checkout@v4
      - name: Run pjdfstest (${{ matrix.fs_type }})
        uses: ./.github/actions/test
        with:
          auto_test: 'conformance'
          conformance_test_suite: 'pjdfstest'
          release: true
          pjdfstest_fs_type: ${{ matrix.fs_type }}
