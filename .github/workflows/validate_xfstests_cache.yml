name: Validate xfstests prebuilt cache

on:
  workflow_dispatch:
  push:
    branches: [fix/xfstests-prebuilt-cache-validation]

permissions:
  contents: read

env:
  BASE_IMAGE: asterinas/kernel-dev@sha256:3d9970e695db7f769ef3eb135c7cd561c3f4b86605785854374c807380480d26

jobs:
  build:
    if: github.repository == 'chinrw/asterinas'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Free build disk space
        run: sudo rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and validate the candidate image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '%s\n' "$GITHUB_SHA" > evidence/source-revision.txt
          printf '%s\n' "$BASE_IMAGE" > evidence/base-image.txt
          date -u +%Y-%m-%dT%H:%M:%S.%NZ > evidence/build-start.txt
          docker pull "$BASE_IMAGE" 2>&1 | tee evidence/base-pull.log
          docker image inspect "$BASE_IMAGE" > evidence/base-image-inspect.json
          image_tag="ghcr.io/chinrw/asterinas-xfstests-validation:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$image_tag" > evidence/candidate-tag.txt
          docker build --progress=plain \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --tag "$image_tag" \
            --file .github/diagnostics/xfstests-cache.Dockerfile . \
            2>&1 | tee evidence/build.log
          docker image inspect "$image_tag" > evidence/candidate-image-inspect.json
          container_id=$(docker create "$image_tag")
          trap 'docker rm "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/opt/xfstests-validation/evidence/." evidence/
          date -u +%Y-%m-%dT%H:%M:%S.%NZ > evidence/build-finish.txt
      - name: Publish the fork validation image
        id: publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          image_tag=$(cat evidence/candidate-tag.txt)
          docker push "$image_tag" 2>&1 | tee evidence/push.log
          image_ref=$(docker image inspect "$image_tag" --format '{{index .RepoDigests 0}}')
          case "$image_ref" in
            ghcr.io/chinrw/asterinas-xfstests-validation@sha256:*) ;;
            *) printf 'Unexpected image reference: %s\n' "$image_ref" >&2; exit 1 ;;
          esac
          printf '%s\n' "$image_ref" > evidence/candidate-image.txt
          printf 'image=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect --raw "$image_ref" > evidence/candidate-manifest.json
          docker buildx imagetools inspect --raw "$BASE_IMAGE" > evidence/base-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = {}
          for kind in ("base", "candidate"):
              inspected = json.loads(Path(f"evidence/{kind}-image-inspect.json").read_text())[0]
              manifest = json.loads(Path(f"evidence/{kind}-manifest.json").read_text())
              data[kind] = {
                  "image_id": inspected["Id"],
                  "uncompressed_bytes": inspected["Size"],
                  "compressed_layer_bytes": sum(layer["size"] for layer in manifest["layers"]) if "layers" in manifest else None,
              }
          data["uncompressed_delta_bytes"] = data["candidate"]["uncompressed_bytes"] - data["base"]["uncompressed_bytes"]
          Path("evidence/image-sizes.json").write_text(json.dumps(data, indent=2) + "\n")
          print(json.dumps(data, indent=2))
          PY
      - name: Save build and GC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xfstests-cache-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 14

  samples:
    if: github.repository == 'chinrw/asterinas'
    needs: build
    name: ext2 ${{ matrix.variant }} sample ${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: candidate, sample: 1 }
          - { variant: candidate, sample: 2 }
          - { variant: candidate, sample: 3 }
          - { variant: candidate, sample: 4 }
          - { variant: candidate, sample: 5 }
          - { variant: baseline, sample: 1 }
    container:
      image: ${{ matrix.variant == 'candidate' && needs.build.outputs.image || 'asterinas/kernel-dev@sha256:3d9970e695db7f769ef3eb135c7cd561c3f4b86605785854374c807380480d26' }}
      credentials:
        username: ${{ matrix.variant == 'candidate' && github.actor || '' }}
        password: ${{ matrix.variant == 'candidate' && secrets.GITHUB_TOKEN || '' }}
      options: --device=/dev/kvm
      volumes:
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    defaults:
      run:
        shell: bash
    env:
      NIX_CONFIG: sandbox = false
      SAMPLE_IMAGE: ${{ matrix.variant == 'candidate' && needs.build.outputs.image || 'asterinas/kernel-dev@sha256:3d9970e695db7f769ef3eb135c7cd561c3f4b86605785854374c807380480d26' }}
      SAMPLE_VARIANT: ${{ matrix.variant }}
      SAMPLE_NUMBER: ${{ matrix.sample }}
    steps:
      - name: Free disk space
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%S.%NZ | tee "$RUNNER_TEMP/xfstests-cleanup-start.txt"
          df -B1 /
          rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
          df -B1 /
          date -u +%Y-%m-%dT%H:%M:%S.%NZ | tee "$RUNNER_TEMP/xfstests-cleanup-finish.txt"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record sample identity
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp "$RUNNER_TEMP"/xfstests-cleanup-*.txt evidence/
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -c /dev/kvm
          if [ "$SAMPLE_VARIANT" = candidate ]; then
            test "$(cat /opt/xfstests-validation/evidence/source-revision.txt)" = "$GITHUB_SHA"
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          names = ("GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "SAMPLE_IMAGE", "SAMPLE_VARIANT", "SAMPLE_NUMBER", "RUNNER_OS", "RUNNER_ARCH")
          Path("evidence/identity.json").write_text(json.dumps({name: os.environ.get(name) for name in names}, indent=2) + "\n")
          PY
          uname -a | tee evidence/uname.txt
          lscpu > evidence/lscpu.txt
          nix --version | tee evidence/nix-version.txt
          sha256sum test/initramfs/src/conformance/xfstests/ext2/run_list/short.list > evidence/runlist-sha256.txt
      - name: Run the complete ext2 short suite
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%S.%NZ | tee evidence/run-start.txt
          set +e
          make run_kernel AUTO_TEST=conformance RELEASE=1 CONFORMANCE_TEST_SUITE=xfstests \
            MEM=12G XFSTESTS_FS_TYPE=ext2 XFSTESTS_RUNLIST=short.list XFSTESTS_DISK_SIZE=2G \
            2>&1 | tee evidence/run.log
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${pipeline_status[0]}" > evidence/make-exit-code.txt
          date -u +%Y-%m-%dT%H:%M:%S.%NZ | tee evidence/run-finish.txt
          test "${pipeline_status[1]}" -eq 0
          exit "${pipeline_status[0]}"
      - name: Verify all 78 tests completed without skips
        if: always()
        run: |
          set -euo pipefail
          python3 .github/diagnostics/xfstests-cache-verify.py qemu.log \
            test/initramfs/src/conformance/xfstests/ext2/run_list/short.list evidence/suite-summary.json
      - name: Save every sample result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ext2-${{ matrix.variant }}-${{ matrix.sample }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            qemu.log
            qemu-serial.log
          retention-days: 14
