# Test disk provisioning on the Linux host without booting AsterNixOS.
name: Test AsterNixOS installer

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths: &installer_paths
      - distro/aster_nixos_installer/**
      - tools/github_workflows/stress_installer_provisioning.sh
      - .github/workflows/test_nixos_installer.yml
  push:
    branches: [main, diagnostics/installer-cleanup-20260920]
    paths: *installer_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Guard against the loop-partition readiness race (issue #3700).
  stress-installer-provisioning:
    name: Stress disk provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: endersonmenezes/free-disk-space@v3
        with:
          rm_cmd: "rmz"
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
      - uses: actions/checkout@v4
      - name: Record host environment
        run: |
          uname -r
          udevadm --version
          docker --version
      - name: Run the installer provisioning path 500 times
        uses: maus007/docker-run-action-fork@v1
        with:
          image: asterinas/kernel-dev:0.18.1-20260901
          options: --privileged -v /dev:/dev:ro -v ${{ github.workspace }}:/root/asterinas
          # docker-run-action-fork joins these lines with ';' and runs them via
          # `sh -c`, which does not enable fail-fast behavior. We need an explicit
          # `set -e` so a failed command stops the step.
          run: |
            set -e
            losetup --version
            bash tools/github_workflows/stress_installer_provisioning.sh
            remaining=$(losetup -a)
            if printf '%s' "$remaining" | grep -q installer-provisioning-stress; then exit 1; fi
            test -z "$(find /tmp -maxdepth 1 -type d -name 'installer-provisioning-stress.*' -print -quit)"
            echo 'No stress images remain associated; no stress temporary directories remain'
      - name: Check Docker action failure propagation
        id: fail-fast-probe
        continue-on-error: true
        uses: maus007/docker-run-action-fork@v1
        with:
          image: asterinas/kernel-dev:0.18.1-20260901
          options: -v ${{ github.workspace }}:/root/asterinas
          run: |
            set -e
            sh -c 'exit 17'
            touch /root/asterinas/.fail-fast-unexpected
      - name: Verify the failed command stopped the step
        run: |
          test '${{ steps.fail-fast-probe.outcome }}' = failure
          test ! -e .fail-fast-unexpected
