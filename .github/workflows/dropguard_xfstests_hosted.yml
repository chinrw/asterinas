# SPDX-License-Identifier: MPL-2.0

name: DropGuard full xfstests on hosted runner

on:
  push:
    branches: [ci/dropguard-xfstests-hosted]

permissions:
  contents: read

env:
  SOURCE_SHA: 1f5b68b5658cecbb93ba8781a8bcb95205257f1d

jobs:
  xfstests-full:
    if: github.repository == 'chinrw/asterinas'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
      volumes:
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    env:
      RUSTUP_HOME: /root/.rustup
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - name: Free the standard runner tool directories
        run: |
          rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
          df -h .
          free -h
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify the product revision
        run: test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Run the original ext2 full.list
        run: make run_kernel AUTO_TEST=conformance CONFORMANCE_TEST_SUITE=xfstests RELEASE=1 MEM=12G XFSTESTS_FS_TYPE=ext2 XFSTESTS_RUNLIST=full.list XFSTESTS_DISK_SIZE=12G
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-xfstests-full-logs
          path: |
            qemu.log
            qemu-serial.log
