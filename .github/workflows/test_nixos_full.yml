# SPDX-License-Identifier: MPL-2.0
name: Benchmark timer retirement on fresh guests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    if: github.repository == 'chinrw/asterinas'
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Require EPYC 7763
        run: |
          lscpu
          if ! grep -Eq '^model name[[:space:]]*:.*AMD EPYC 7763' /proc/cpuinfo; then
            echo CPU_CLASS_MISMATCH
            exit 1
          fi
      - uses: endersonmenezes/free-disk-space@v3
        with:
          rm_cmd: rmz
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
      - uses: actions/checkout@v4
      - name: Build matched kernels and run fresh-guest samples
        timeout-minutes: 70
        uses: maus007/docker-run-action-fork@v1
        with:
          image: asterinas/kernel-dev:0.19.0-20261012
          options: --privileged -v /dev:/dev -v ${{ github.workspace }}:/root/asterinas
          run: |
            set -e
            export TIMER_BENCHMARK_EPHEMERAL=1
            export ENABLE_KVM=1 SMP=1 MEM=8G QEMU_DISPLAY=none
            bash test/nixos/tests/development-tools-go/build_fresh_benchmark.sh
      - name: Upload benchmark records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retirement-fresh-benchmark-${{ github.run_id }}
          path: |
            target/notingo-native-controls/fresh-benchmark/
            !target/notingo-native-controls/fresh-benchmark/**/*.img
            target/osdk/asterinas/asterinas-osdk-bin
          retention-days: 5
          if-no-files-found: ignore
