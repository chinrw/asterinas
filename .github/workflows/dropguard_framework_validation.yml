# SPDX-License-Identifier: MPL-2.0

name: DropGuard framework validation in fork

on:
  push:
    branches: [ci/dropguard-framework]

permissions:
  contents: read

env:
  SOURCE_SHA: 1f5b68b5658cecbb93ba8781a8bcb95205257f1d

jobs:
  framework:
    if: github.repository == 'chinrw/asterinas'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: asterinas/kernel-dev:0.19.0-20261012
    env:
      RUSTUP_HOME: /root/.rustup
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify tested revision
        shell: bash
        run: test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Run the complete NixOS test workspace host tests
        run: cargo test --manifest-path test/nixos/Cargo.toml --workspace --locked
