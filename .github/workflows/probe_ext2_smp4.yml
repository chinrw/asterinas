name: Probe ext2 SMP4

# Fork-only experiment: roll the dice on the BIO completion-ordering race.
# Each round is an independent debug-build boot running the regression suite
# (including bio_stress: parallel cold faults on /ext2) with SMP=4 -- a 1:1
# vCPU-to-host-core mapping on the 4-core runner, no oversubscription. A red
# round reproduces the bug on main; green rounds prove nothing (one-sided).

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/**'

jobs:
  probe:
    runs-on: ubuntu-latest
    container:
      image: asterinas/asterinas:0.18.0-20260702
      options: -v /dev:/dev --privileged
      volumes:
        # Map the following directories on the host into the container so that
        # the container can remove them to save some precious disk space (~16GB),
        # which is quite limited on free-tier Github runners.
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Free disk space
        run: rm -rf /usr/lib/google-cloud-sdk/* /usr/local/lib/android/* /usr/share/dotnet/*
      - uses: actions/checkout@v4
      - name: Run bio_stress on ext2 with SMP=4 (round ${{ matrix.round }})
        uses: ./.github/actions/test
        with:
          auto_test: 'regression'
          release: false
          smp: 4
          netdev: 'tap'
          boot_protocol: 'linux-efi-handover64'
