name: Recheck Cachix disk profiles

on:
  push:
    branches:
      - fix/cachix-profile-completion-20261023

permissions:
  contents: read
  actions: read

jobs:
  profile:
    if: github.repository == 'chinrw/asterinas'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: published-${{ matrix.architecture }}
          path: published
          run-id: 39764157003
          github-token: ${{ github.token }}
      - name: Collect both consumers before rejecting invalid profiles
        run: |
          python3 tools/github_workflows/cachix-full-validation/benchmark.py \
            profile --published published --output full-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumers-${{ matrix.architecture }}-profile
          path: |
            full-results/
            !full-results/context/**
