name: Timer lint recheck

on:
  push:
    branches: [validate/timer-arena-rbtree]
    paths: [.github/workflows/timer_lint_recheck.yml]
  workflow_dispatch:

jobs:
  basic-test:
    name: Timer lint (${{ matrix.arch }})
    runs-on: ubuntu-latest
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, riscv64, loongarch64]
        id: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Run the original lint action
        uses: ./.github/actions/test
        with:
          auto_test: general
          arch: ${{ matrix.arch }}
