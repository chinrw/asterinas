# SPDX-License-Identifier: MPL-2.0

name: Installer provisioning A/B

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostics/installer-stress-ab-*

permissions:
  contents: read

jobs:
  stress:
    if: github.repository == 'chinrw/asterinas'
    name: ${{ matrix.variant }}-${{ matrix.round }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, patched]
        round: [1, 2]
    steps:
      - uses: endersonmenezes/free-disk-space@v3
        with:
          rm_cmd: "rmz"
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select installer and record inputs
        env:
          VARIANT: ${{ matrix.variant }}
          ROUND: ${{ matrix.round }}
        run: |
          installer=distro/aster_nixos_installer/templates/aster-nixos-install
          git diff --exit-code 750abc2c79d1f869293a2e1f58455d660a307cb4 -- "$installer"
          if [ "$VARIANT" = baseline ]; then
            git show "1601bf53792fd81420a4f3c1da3119e84d5b36ef:$installer" > "$installer"
          fi
          {
            printf 'variant=%s round=%s\n' "$VARIANT" "$ROUND"
            git rev-parse HEAD
            sha256sum tools/github_workflows/stress_installer_provisioning.sh "$installer"
            uname -a
            udevadm --version
            git diff -- "$installer"
          } | tee installer-metadata.txt
      - name: Run 500 provisioning iterations
        uses: maus007/docker-run-action-fork@v1
        with:
          image: asterinas/kernel-dev:0.18.1-20260901
          options: --privileged -v /dev:/dev -v ${{ github.workspace }}:/root/asterinas
          run: |
            set -e
            bash -o pipefail -c 'bash /root/asterinas/tools/github_workflows/stress_installer_provisioning.sh 2>&1 | tee /root/asterinas/installer-stress.log'
      - name: Record image digest
        if: always()
        run: docker image inspect asterinas/kernel-dev:0.18.1-20260901 --format '{{json .RepoDigests}}' >> installer-metadata.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.variant }}-${{ matrix.round }}
          path: |
            installer-metadata.txt
            installer-stress.log
          retention-days: 14
