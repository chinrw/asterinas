name: Test ISO image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - distro/**
      - .github/workflows/test_iso_image.yml
      - tools/nixos/**
  push:
    branches:
      - main
    paths:
      - flake.nix
      - flake.lock
      - distro/**
      - .github/workflows/test_iso_image.yml
      - tools/nixos/**

jobs:
  iso-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: endersonmenezes/free-disk-space@v3
        with:
          rm_cmd: "rmz"
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
      - uses: actions/checkout@v4
      - name: Build, install, and boot the ISO
        uses: maus007/docker-run-action-fork@v1
        with:
          image: asterinas/kernel-dev:0.18.1-20260918
          options: --device /dev/kvm -v ${{ github.workspace }}:/root/asterinas
          run: |
            git config --system --add safe.directory "$PWD"
            make iso NIXOS_TEST_SUITE=hello NETDEV=user
            make run_iso NETDEV=user || true
            grep -q "^Congratulations!" qemu.log
            cp qemu.log target/nixos/iso-install.log
            make run_nixos NIXOS_TEST_SUITE=hello NETDEV=user
