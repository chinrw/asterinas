name: Repeat the original quiet pipe13 group on one fork runner

on:
  push:
    branches: [ci/dropguard-pipe13-quiet-20261116]

permissions:
  contents: read

jobs:
  quiet-comparison:
    if: github.repository == 'chinrw/asterinas'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      QUIET_OUTPUT: ${{ runner.temp }}/dropguard-pipe13-quiet
    steps:
      - name: Start the bounded host budget
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json,os,pathlib,time
          output=pathlib.Path(os.environ['QUIET_OUTPUT'])
          output.mkdir()
          started=time.monotonic()
          state={'host_boot_id':pathlib.Path('/proc/sys/kernel/random/boot_id').read_text().strip(),
                 'started_monotonic':started,'deadline_monotonic':started+350*60,
                 'planned_maximum_rounds':24,'minimum_rounds':12,'pair_reserve_minutes':175}
          (output/'state.json').write_text(json.dumps(state,indent=2)+'\n')
          PYTHON
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: a0de2258c56b03ba1a6aa417a05f10bdc0f54ff4
          path: checkouts/baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 564bd54533c8b012f441f7fca2863cdde6b57434
          path: checkouts/candidate
          persist-credentials: false
      - name: Prepare both versions through the original Make workflow
        id: prepare
        timeout-minutes: 185
        shell: bash
        run: python3 controller/.github/scripts/dropguard_pipe13_quiet.py prepare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-pipe13-preparation
          path: ${{ env.QUIET_OUTPUT }}/preparation/
      - name: Round 01 (baseline)
        if: ${{ !cancelled() && steps.prepare.conclusion == 'success' }}
        timeout-minutes: 85
        shell: bash
        run: python3 controller/.github/scripts/dropguard_pipe13_quiet.py round 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-pipe13-round01-baseline
          path: ${{ env.QUIET_OUTPUT }}/round-01-baseline/
          if-no-files-found: ignore
      - name: Round 02 (candidate)
        if: ${{ !cancelled() && steps.prepare.conclusion == 'success' }}
        timeout-minutes: 85
