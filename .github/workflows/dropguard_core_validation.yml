# SPDX-License-Identifier: MPL-2.0

name: Prepared DropGuard core validation in fork

on:
  push:
    branches: [ci/dropguard-prepared-20261116]

permissions:
  contents: read

concurrency:
  group: dropguard-core-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: 564bd54533c8b012f441f7fca2863cdde6b57434

jobs:
  core:
    if: github.repository == 'chinrw/asterinas'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        smp: [1, 4]
        release: [0, 1]
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
    env:
      RUSTUP_HOME: /root/.rustup
      CARGO_HOME: /root/.cargo
      OSTD_TASK_STACK_SIZE_IN_PAGES: 64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Record the actual tested product revision
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)
          test "$actual" = "$SOURCE_SHA"
          printf '%s\n' "$actual" | tee tested-source.txt
      - name: Verify revision and build the current OSDK
        shell: bash
        run: |
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$SOURCE_SHA"
          set -euo pipefail
          OSDK_LOCAL_DEV=1 cargo build --manifest-path osdk/Cargo.toml --locked --bin cargo-osdk --target-dir target/dropguard-osdk |& tee core-osdk-build.log
      - name: Run every core kernel test with visible serial output
        shell: bash
        run: |
          set -euo pipefail
          test ! -e kernel/core/OSDK.toml
          cat > kernel/core/OSDK.toml <<EOF
          [boot]
          method = "grub-rescue-iso"
          [grub]
          boot_protocol = "multiboot2"
          [qemu]
          args = "-machine q35 -cpu host,+x2apic -accel kvm -m 2G -nographic -display none -monitor none -bios /root/ovmf/release/OVMF.fd -device isa-debug-exit,iobase=0xf4,iosize=0x04"
          [test.qemu]
          args = "-machine q35 -cpu host,+x2apic -accel kvm -m 2G -nographic -display none -monitor none -bios /root/ovmf/release/OVMF.fd -device isa-debug-exit,iobase=0xf4,iosize=0x04"
          log_file = "$GITHUB_WORKSPACE/target/dropguard-core-serial.log"
          EOF
          trap 'rm -f kernel/core/OSDK.toml' EXIT
          osdk="$GITHUB_WORKSPACE/target/dropguard-osdk/debug/cargo-osdk"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/dropguard-core"
          args=(osdk test --no-default-features --kcmd-args=earlycon --kcmd-args=console=ttyS0 '--qemu-args=-smp ${{ matrix.smp }}')
          if [[ '${{ matrix.release }}' == 1 ]]; then
            args+=(--release)
          fi
          (cd kernel/core && "$osdk" "${args[@]}") 2>&1 | tee target/dropguard-core.log
      - name: Require the complete core result and new rollback cases
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          text = pathlib.Path('target/dropguard-core.log').read_text()
          text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', text)
          assert re.search(r'test result: ok\. 147 passed; 0 failed; 0 filtered out\.', text)
          for name in [
              'file_buffered_write_enospc_rollback',
              'falloc_unsupported_preserves_keep_size_allocation',
              'falloc_keep_size_enospc_rollback',
              'block_alloc_indirect_conflict_rolls_back_cache',
          ]:
              assert name in text, name
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-smp${{ matrix.smp }}-release${{ matrix.release }}
          path: |
            tested-source.txt
            target/dropguard-core.log
            target/dropguard-core-serial.log
            core-osdk-build.log
