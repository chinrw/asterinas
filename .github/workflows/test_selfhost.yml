name: Test self-host build

# Build Asterinas inside Asterinas: install Asterinas NixOS, boot it as L1,
# build the kernel there, and boot that kernel as a nested L2 guest.
# One run takes about two hours, so it runs weekly and on demand instead of
# on PRs.

on:
  push:
    branches: [ci/tcp-logger-e2]
  workflow_dispatch:
  schedule:
    # Every Saturday at 02:00 UTC.
    - cron: '0 2 * * 6'

jobs:
  selfhost-x86:
    runs-on: ubuntu-latest
    # E2 logger experiment (temporary): three Nix log formats, three jobs
    # each, all started at once so that the arms share the same network
    # conditions.
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix:
        fmt: [raw, bar, barpipe]
        attempt: [1, 2, 3]
    steps:
      # The L1 disk (32 GiB, allocated up front) and the swap file below need
      # more space than the runner has free by default.
      - uses: endersonmenezes/free-disk-space@v3
        with:
          rm_cmd: "rmz"
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
      - uses: actions/checkout@v4
      - name: Add swap for the L1 guest
        # Asterinas never evicts page cache, so L1 keeps every file it
        # downloads or builds in memory and uses about 31 GiB. The runner has
        # 16 GiB, so host swap holds the pages that L1 no longer touches.
        # 28 GiB of swap covers the full 40 GiB that the Book gives L1.
        run: |
          sudo swapoff -a
          sudo fallocate -l 28G /mnt/l1.swap
          sudo chmod 600 /mnt/l1.swap
          sudo mkswap /mnt/l1.swap
          sudo swapon /mnt/l1.swap
      - name: Sample host memory, swap, and disk
        run: |
          cat >"$RUNNER_TEMP/sample.sh" <<'EOF'
          while :; do
            mem=$(free -m | awk '/Mem:/{printf "mem_used=%s ", $3} /Swap:/{printf "swap_used=%s ", $3}')
            swp=$(awk '/^pswp(in|out) /{printf "%s=%s ", $1, $2}' /proc/vmstat)
            psi=$(awk '{sub("total=", "", $5); printf "psi_mem_%s_us=%s ", $1, $5}' /proc/pressure/memory 2>/dev/null)
            console=$(stat -c %s "$GITHUB_WORKSPACE/target/selfhost-chain/l1-console.log" 2>/dev/null || echo 0)
            echo "$(date -u +%T) ${mem}${swp}${psi}disk_avail=$(df -BG --output=avail / | tail -1 | tr -d ' ') console_bytes=${console}"
            sleep 30
          done
          EOF
          nohup bash "$RUNNER_TEMP/sample.sh" >"$RUNNER_TEMP/host-mem.log" 2>&1 &
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Configure the Asterinas caches
        # `make iso` and `make run_iso` run nested Nix builds, which do not
        # read the flake's nixConfig.
        uses: cachix/cachix-action@v17
        with:
          name: aster-nixos-dev
          extraPullNames: aster-nixos-release
          skipPush: true
      - name: Build the installer ISO
        run: nix develop --accept-flake-config --command make iso
      - name: Install Asterinas NixOS on a new disk
        run: |
          nix develop --accept-flake-config --command \
            make run_iso NIXOS_DISK_SIZE_IN_MB=32768
      - name: Repeat the flake-input fetch window inside L1
        # The chain stops the loop after SELFHOST_LOOP_BUDGET seconds. The
        # step timeout is a backstop that still leaves time for the upload.
        timeout-minutes: 130
        env:
          SELFHOST_REPO: ${{ github.repository }}
          SELFHOST_BRANCH: ${{ github.ref_name }}
          SELFHOST_LOG_FMT: ${{ matrix.fmt }}
          SELFHOST_LOOP_BUDGET: 7200
        run: nix develop --accept-flake-config --command tools/nixos/selfhost_chain.sh
      - name: Upload the L1 console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-l1-console-${{ matrix.fmt }}-${{ matrix.attempt }}
          path: |
            target/selfhost-chain/l1-console.log
            ${{ runner.temp }}/host-mem.log
          if-no-files-found: ignore
