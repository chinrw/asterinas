# SPDX-License-Identifier: MPL-2.0

name: DropGuard SMP4 baseline in fork

on:
  push:
    branches: [ci/dropguard-ktest-baseline]

permissions:
  contents: read

jobs:
  ktest-smp4-baseline:
    if: github.repository == 'chinrw/asterinas'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        release: [0, 1]
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
    env:
      RUSTUP_HOME: /root/.rustup
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a0de2258c56b03ba1a6aa417a05f10bdc0f54ff4
          persist-credentials: false
      - name: Run the same complete kernel test matrix on the unmodified base
        run: make ktest NETDEV=tap SMP=4 RELEASE=${{ matrix.release }}
