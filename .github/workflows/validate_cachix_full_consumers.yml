name: Measure complete personal-cache consumers

on:
  push:
    branches:
      - validate/cachix-full-consumers-20261022
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  consumers:
    if: github.repository == 'chinrw/asterinas'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        kind: [timing, profile]
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: published-${{ matrix.architecture }}
          path: published
          run-id: 39764157003
          github-token: ${{ github.token }}
      - name: Run cold consumers with the existing GC boundaries
        run: |
          python3 tools/github_workflows/cachix-full-validation/benchmark.py \
            '${{ matrix.kind }}' --published published --output full-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumers-${{ matrix.architecture }}-${{ matrix.kind }}
          path: |
            full-results/
            !full-results/context/**
